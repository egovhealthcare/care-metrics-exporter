services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  exporter:
    build:
      context: .
      dockerfile: docker/prod.Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"
