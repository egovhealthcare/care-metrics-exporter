# Example only. Do NOT commit a real broker URL.
#
# In a CARE deployment this Secret already exists as `care-backend-secret` and
# the exporter reads only its CELERY_BROKER_URL key, so you do not need this
# file at all. It exists so the manifests can be tried on a bare cluster.
#
# Create it imperatively instead of committing a value:
#
#   kubectl create secret generic care-backend-secret \
#     --from-literal=CELERY_BROKER_URL='redis://redis.care.svc.cluster.local:6379/0'
apiVersion: v1
kind: Secret
metadata:
  name: care-backend-secret
type: Opaque
stringData:
  CELERY_BROKER_URL: "redis://redis.care.svc.cluster.local:6379/0"
